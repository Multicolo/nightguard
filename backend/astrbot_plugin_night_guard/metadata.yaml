name: astrbot_plugin_night_guard
display_name: 守夜鱼 NightGuard
short_desc: 到点把手机盖成关不掉的聊天框，陪你和 AstrBot 角色求情睡觉。
desc: 守夜鱼（NightGuard）的 AstrBot 后端。到点后手机被全屏聊天框盖住，只能跟你的 AstrBot 角色求情；一晚只放行一次，可以求一张「准备睡觉」的照片，聊久了会自己结束会话。人设读取 AstrBot 默认人设，也可以关掉用通用人设。需要配合 Android App 使用，APK 见主仓库 Releases。
version: v1.2.0
author: 花影落闲庭
repo: https://github.com/Multicolo/astrbot_plugin_night_guard
astrbot_version: ">=4.16"
tags:
