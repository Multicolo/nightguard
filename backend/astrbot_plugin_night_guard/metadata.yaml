# ============================================================================
# 手机端 IP 怎么填（App → 设置页 → 服务器地址）
# ----------------------------------------------------------------------------
# 填「运行 AstrBot 的那台机器」的局域网 IP，不是手机自己的 IP。
# 例：http://192.168.1.100:6200   或   https://你的域名/night
# 不要填 127.0.0.1 / localhost（在手机上指手机自己）；不要带 /health。
# 手机和服务器必须在同一 Wi-Fi / 局域网。
# 查服务器 IP：Windows 用 ipconfig；Linux 用 ip addr。
# 查手机自己的 IP：设置 → WLAN → 当前网络 → IP 地址（仅排查/防火墙用）。
# ============================================================================
